name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Build TypeScript and run JS/TS tests
  build-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run TypeScript tests
        run: npm test

      - name: Verify build output
        run: |
          test -f build/index.js || (echo "build/index.js not found" && exit 1)
          test -f build/index.d.ts || (echo "build/index.d.ts not found" && exit 1)

  # Build Android native libraries from source
  build-android-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build libopus for Android
        run: |
          chmod +x scripts/build-opus-android.sh
          ./scripts/build-opus-android.sh

      - name: Build LAME for Android
        run: |
          chmod +x scripts/build-lame-android.sh
          ./scripts/build-lame-android.sh

      - name: Verify Android native files
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f android/src/main/jniLibs/$abi/libopus.a || (echo "libopus.a not found for $abi" && exit 1)
            test -f android/src/main/jniLibs/$abi/libmp3lame.a || (echo "libmp3lame.a not found for $abi" && exit 1)
          done
          test -f android/src/main/cpp/include/lame/lame.h || (echo "lame.h header not found" && exit 1)
          echo "All Android native files built successfully"

      - name: Upload Android native files
        uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: |
            android/src/main/jniLibs/
            android/src/main/cpp/include/lame/
          retention-days: 90

  # Build iOS native libraries from source
  build-ios-native:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build libopus and libogg for iOS
        run: |
          chmod +x scripts/build-opus-ios.sh
          ./scripts/build-opus-ios.sh

      - name: Verify iOS xcframeworks
        run: |
          test -d ios/Frameworks/libopus.xcframework || (echo "libopus.xcframework not found" && exit 1)
          test -d ios/Frameworks/libogg.xcframework || (echo "libogg.xcframework not found" && exit 1)
          plutil -p ios/Frameworks/libopus.xcframework/Info.plist
          plutil -p ios/Frameworks/libogg.xcframework/Info.plist
          echo "iOS frameworks built successfully"

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: ios/Frameworks/
          retention-days: 90
