name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  # Build Android native libraries
  build-android-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build libopus for Android
        run: |
          chmod +x scripts/build-opus-android.sh
          ./scripts/build-opus-android.sh

      - name: Build LAME for Android
        run: |
          chmod +x scripts/build-lame-android.sh
          ./scripts/build-lame-android.sh

      - name: Verify Android native files
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f android/src/main/jniLibs/$abi/libopus.a || (echo "libopus.a not found for $abi" && exit 1)
            test -f android/src/main/jniLibs/$abi/libmp3lame.a || (echo "libmp3lame.a not found for $abi" && exit 1)
          done
          test -f android/src/main/cpp/include/lame/lame.h || (echo "lame.h header not found" && exit 1)
          echo "All Android native files built successfully"

      - name: Upload Android native files
        uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: |
            android/src/main/jniLibs/
            android/src/main/cpp/include/lame/

  # Build iOS native libraries
  build-ios-native:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build libopus and libogg for iOS
        run: |
          chmod +x scripts/build-opus-ios.sh
          ./scripts/build-opus-ios.sh

      - name: Verify iOS xcframeworks
        run: |
          test -d ios/Frameworks/libopus.xcframework || (echo "libopus.xcframework not found" && exit 1)
          test -d ios/Frameworks/libogg.xcframework || (echo "libogg.xcframework not found" && exit 1)

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: ios/Frameworks/

  # Run tests before publishing
  test:
    runs-on: ubuntu-latest
    needs: [build-android-native, build-ios-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android native files
        uses: actions/download-artifact@v4
        with:
          name: android-native
          path: android/src/main/

      - name: Download iOS frameworks
        uses: actions/download-artifact@v4
        with:
          name: ios-frameworks
          path: ios/Frameworks/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm test

  # Publish to npm
  publish:
    runs-on: ubuntu-latest
    needs: [build-android-native, build-ios-native, test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android native files
        uses: actions/download-artifact@v4
        with:
          name: android-native
          path: android/src/main/

      - name: Download iOS frameworks
        uses: actions/download-artifact@v4
        with:
          name: ios-frameworks
          path: ios/Frameworks/

      - name: Verify all native libraries present
        run: |
          echo "Verifying iOS frameworks..."
          test -d ios/Frameworks/libopus.xcframework || (echo "libopus.xcframework not found" && exit 1)
          test -d ios/Frameworks/libogg.xcframework || (echo "libogg.xcframework not found" && exit 1)
          echo "Verifying Android jniLibs..."
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f android/src/main/jniLibs/$abi/libopus.a || (echo "libopus.a not found for $abi" && exit 1)
            test -f android/src/main/jniLibs/$abi/libmp3lame.a || (echo "libmp3lame.a not found for $abi" && exit 1)
          done
          echo "Verifying Android headers..."
          test -f android/src/main/cpp/include/lame/lame.h || (echo "lame.h header not found" && exit 1)
          echo "All native libraries verified!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@avify-com'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.js || (echo "build/index.js not found" && exit 1)
          test -f build/index.d.ts || (echo "build/index.d.ts not found" && exit 1)

      - name: Validate version matches tag (on release)
        if: ${{ github.event_name == 'release' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix from tag if present
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Version mismatch: tag=${{ github.ref_name }} package.json=v$PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - name: Update version (if provided)
        if: ${{ github.event.inputs.version != '' }}
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
